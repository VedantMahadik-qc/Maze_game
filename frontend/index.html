<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantum Chase Horror -- prototype</title>
  </head>
  <body>
    <div id="blocker">
      <div id="menu">
        <h1>[Working title]</h1>
        <p>Reach the exit. Duck into rooms to break line of sight.<br />
           Stay in corridors too long and it gets you.</p>
        <p class="hint">WASD to move, mouse to look, Shift to sprint, click to start</p>
      </div>
    </div>
    <div id="hud">
      <div id="proximity-bar"><div id="proximity-fill"></div></div>
    </div>
    <div id="end-screen" class="hidden">
      <h1 id="end-title"></h1>
      <p class="hint">Click to try again</p>
    </div>
    <div id="static-overlay"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
